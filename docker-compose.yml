services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL 18 Relational Financial Database
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:18-alpine
    container_name: arthsavora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-arthsavora}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-arthsavora}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - arthsavora-net

  # ----------------------------------------------------------------------------
  # 2. Redis In-Memory Cache & Message Broker
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: arthsavora-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - arthsavora-net

  # ----------------------------------------------------------------------------
  # 3. ARTHSAVORA FastAPI Application Engine
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: arthsavora-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      SECRET_KEY: ${SECRET_KEY:-arthsavora-dev-insecure-secret-key-change-in-production-12345678}
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-arthsavora}
      REDIS_URL: redis://redis:6379/0
      ENABLE_HSTS: ${ENABLE_HSTS:-false}
      CORS_ORIGINS: '["http://localhost", "http://localhost:80", "http://localhost:3000", "http://localhost:5173"]'
    ports:
      - "8000:8000"
    volumes:
      - document_storage:/app/storage/documents
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - arthsavora-net

  # ----------------------------------------------------------------------------
  # 4. ARTHSAVORA Nginx Static Web & PWA Server
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: arthsavora-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/nginx-health"]
      interval: 20s
      timeout: 3s
      retries: 3
    networks:
      - arthsavora-net

volumes:
  postgres_data:
    name: arthsavora_postgres_data
  redis_data:
    name: arthsavora_redis_data
  document_storage:
    name: arthsavora_document_storage

networks:
  arthsavora-net:
    name: arthsavora_network
    driver: bridge
