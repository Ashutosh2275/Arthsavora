  <path d="M256 96L370 138V250C370 326 320 384 256 410C192 384 142 326 142 250V138L256 96Z" fill="#0f172a" fill-opacity="0.85"/>

  <!-- Rupee Symbol (₹) & Financial Velocity Monogram -->
