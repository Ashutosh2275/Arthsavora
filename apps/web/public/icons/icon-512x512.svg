  <path d="M196 214H316" stroke="url(#goldGrad)" stroke-width="24" stroke-linecap="round"/>
  <path d="M246 170V300C246 326 270 334 296 334" stroke="url(#goldGrad)" stroke-width="24" stroke-linecap="round"/>
